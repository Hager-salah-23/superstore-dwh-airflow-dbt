name: dbt CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    env:
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load raw data into ODS
        run: python scripts/load_to_ods.py

      - name: dbt deps
        working-directory: dbt_project
        run: dbt deps

      - name: dbt build (run + test)
        working-directory: dbt_project
        run: dbt build --profiles-dir . --target dev
